name: tiiac-check

on:
  push:
  pull_request:

jobs:
  reproducibilidad:
    # En la plantilla no se ejecuta: esta incompleta a proposito y saldria
    # siempre en rojo. En vuestro repositorio si corre.
    if: github.repository != 'unai-zulaika/tiiac-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Comprobador de reproducibilidad
        run: python tools/tiiac_check.py .
